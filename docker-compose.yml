services:
  bot:
    build: .
    container_name: whatsapp-bot
    ports:
      - "9000:9000"
    env_file:
      - routing/.env
    environment:
      - ROUTING_DB_PATH=/app/data/faq.db
    volumes:
      - bot-data:/app/data
      - ./backend/uploaded_files:/app/backend/uploaded_files
      - ./backend/models:/app/backend/models
    restart: unless-stopped

volumes:
  bot-data:

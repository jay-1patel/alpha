[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-chatbot"
version = "2.0.0"
description = "AI-powered WhatsApp Business chatbot (FastAPI + SQLite + RAG)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
]

[tool.setuptools]
packages = ["routing", "kb"]

[tool.ruff]
line-length = 120
